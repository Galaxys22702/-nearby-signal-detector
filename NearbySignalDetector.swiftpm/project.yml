name: NearbySignalDetector
options:
  bundleIdPrefix: com.robtheproducer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.3.0
    CODE_SIGN_STYLE: Automatic
targets:
  NearbySignalDetector:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: ContentView.swift
      - path: Models
      - path: Services
      - path: Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robtheproducer.nearbysignaldetector
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Build/Info.plist
      properties:
        CFBundleDisplayName: Nearby Signal Detector
        NSBluetoothAlwaysUsageDescription: Nearby Signal Detector uses Bluetooth to discover nearby Bluetooth Low Energy devices and measure received signal strength.
        UILaunchScreen: {}
