name: Build unsigned iPhone IPA

on:
  push:
    branches:
      - main
      - fix/clean-review-v0.3
    paths:
      - 'NearbySignalDetector.swiftpm/**'
      - '.github/workflows/unsigned-ipa.yml'
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: NearbySignalDetector.swiftpm
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: NearbySignalDetector.swiftpm
        env:
          DEVICE_BUILD_DIR: ${{ runner.temp }}/NearbySignalDetectorDevice
        run: |
          set -euo pipefail
          rm -rf "$DEVICE_BUILD_DIR"
          xcodebuild \
            -project NearbySignalDetector.xcodeproj \
            -scheme NearbySignalDetector \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$DEVICE_BUILD_DIR" \
            build
          test -d "$DEVICE_BUILD_DIR/NearbySignalDetector.app"

      - name: Package unsigned IPA
        env:
          DEVICE_BUILD_DIR: ${{ runner.temp }}/NearbySignalDetectorDevice
          PACKAGE_DIR: ${{ runner.temp }}/NearbySignalDetectorPackage
          IPA_PATH: ${{ runner.temp }}/NearbySignalDetector-unsigned.ipa
        run: |
          set -euo pipefail
          rm -rf "$PACKAGE_DIR" "$IPA_PATH"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$DEVICE_BUILD_DIR/NearbySignalDetector.app" "$PACKAGE_DIR/Payload/"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$IPA_PATH" Payload
          /usr/bin/unzip -t "$IPA_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NearbySignalDetector-unsigned-ipa
          path: ${{ runner.temp }}/NearbySignalDetector-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
