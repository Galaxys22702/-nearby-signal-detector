name: iOS compile check

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: NearbySignalDetector.swiftpm
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: NearbySignalDetector.swiftpm
        run: |
          set -o pipefail
          xcodebuild \
            -project NearbySignalDetector.xcodeproj \
            -scheme NearbySignalDetector \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
